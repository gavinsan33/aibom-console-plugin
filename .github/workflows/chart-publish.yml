name: Publish chart to Quay

# The chart's counterpart to images.yml, which rebuilds the image :latest on
# every push to main. Restricted to pushes that land on main (i.e. merges, not
# every commit on a feature branch) and only when chart content actually
# changed. These are dev builds (<version>-<sha>, image :latest); releases come
# from release.yml on a vX.Y.Z tag.
on:
  push:
    branches: [main]
    paths:
      - "charts/aibom-console/**"

jobs:
  chart-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history and tags, for chart-push's git describe.
          fetch-depth: 0

      - uses: azure/setup-helm@v4

      - uses: extractions/setup-just@v2

      # Robot account, not a personal Quay login — scope it to push-only access
      # on the aibom-console chart repo, same as any other CI credential.
      - name: Log in to Quay
        run: |
          helm registry login quay.io \
            --username "${{ secrets.QUAY_ROBOT_USERNAME }}" \
            --password "${{ secrets.QUAY_ROBOT_TOKEN }}"

      - name: Publish chart
        run: just chart-push
