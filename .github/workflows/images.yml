name: Build image

# Every push to main rebuilds the image as :latest and :<short sha>, which
# `just deploy` and the chart from chart-publish.yml use. This replaces Quay's
# GitHub build trigger, whose generated deploy key GitHub rejects as too short.
on:
  push:
    branches: [main]

env:
  REGISTRY: quay.io/project-aibom

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: quay.io
          username: ${{ secrets.QUAY_ROBOT_USERNAME }}
          password: ${{ secrets.QUAY_ROBOT_TOKEN }}

      - name: Short SHA
        id: sha
        run: echo "sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/aibom-console-plugin:latest
            ${{ env.REGISTRY }}/aibom-console-plugin:${{ steps.sha.outputs.sha }}
