{{- if .Values.networkPolicy.enabled }}
# Lets the OpenShift console reach the plugin's asset endpoint in namespaces
# that isolate ingress.
#
# The console pods (in openshift-console) fetch this plugin's served assets and
# feature-flags.json over the Service on {{ .Values.plugin.port }}. Where the
# install namespace already carries an ingress-isolating NetworkPolicy (e.g. a
# platform-provisioned "allow only from this namespace" default), those fetches
# are dropped -- and because the plugin is registered on the console operator,
# a plugin the console can't load breaks the whole console dashboard, not just
# the AIBOM views.
#
# openshift-console is matched by the kubernetes.io/metadata.name label the
# apiserver stamps on every namespace. Scoped to the plugin pod and its one
# port. Additive -- it only ever allows more ingress, never restricts any.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ template "openshift-console-plugin.name" . }}-console-ingress
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "openshift-console-plugin.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "openshift-console-plugin.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: openshift-console
      ports:
        - protocol: TCP
          port: {{ .Values.plugin.port }}
{{- end }}
